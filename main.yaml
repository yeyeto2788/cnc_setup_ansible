---
- name: Install needed packages for CNC work.
  hosts: 127.0.0.1
  connection: local
  vars_files: ./variables.yaml

  pre_tasks:
    - name: Update packages.
      apt:
        update_cache: true
        cache_valid_time: 3600
      changed_when: false
      become: yes

  tasks:
    - name: Execute tasks with escalated privileges
      block:
        - name: Install extra needed packages
          ansible.builtin.apt:
            name: "{{ packages_to_install }}"
            state: present

        - name: Add user to dialout group
          user:
            name: "{{ ansible_user }}"
            shell: /bin/bash
            groups:
              - dialout
            append: yes
          when: ansible_user != "root"

      become: yes

    - name: Install Candle
      block:
        - name: Install Candle needed packages
          ansible.builtin.apt:
            name: "{{ candle_packages }}"
            state: present
          become: true

        - name: Clone Candle repository
          ansible.builtin.git:
            repo: https://github.com/Denvi/Candle.git
            dest: "/home/{{ ansible_user }}/candle"
            single_branch: yes
            version: "{{ candle_version }}"

        - name: Configure Candle build with CMake
          ansible.builtin.shell:
            cmd: >
              cmake -B build
              -DCMAKE_INSTALL_PREFIX=/home/{{ ansible_user }}/candle/install
              -DCMAKE_BUILD_TYPE=Release
            chdir: "/home/{{ ansible_user }}/candle"
            creates: "/home/{{ ansible_user }}/candle/build/CMakeCache.txt"

        - name: Build and install Candle
          ansible.builtin.shell:
            cmd: cmake --build build --config Release --parallel "{{ ansible_processor_vcpus | default(2) }}" && cmake --install build --config Release
            chdir: "/home/{{ ansible_user }}/candle"
            creates: "/home/{{ ansible_user }}/candle/install/candle"

        - name: Add alias for Candle
          ansible.builtin.lineinfile:
            path: "/home/{{ ansible_user }}/.bashrc"
            line: "alias candle='/home/{{ ansible_user }}/candle/install/candle'"
            state: present

      when: install_candle == True

    - name: Install Gcode utils tool
      block:
        - name: Install Java
          ansible.builtin.apt:
            name: default-jre
            state: present
          become: true

        - name: Create directory for storing the jar file
          ansible.builtin.file:
            path: "/home/{{ ansible_user }}/g-code-utils/"
            state: directory

        - name: Get JavaFX SDK
          ansible.builtin.get_url:
            url: "https://download2.gluonhq.com/openjfx/{{ openjfx_version }}/openjfx-{{ openjfx_version }}_linux-{{ openjfx_architecture }}_bin-sdk.zip"
            dest: "/home/{{ ansible_user }}/g-code-utils/"

        - name: Create directory for storing the JavaFX SDK file
          ansible.builtin.file:
            path: "/home/{{ ansible_user }}/g-code-utils/openjfx-{{ openjfx_version }}"
            state: directory

        - name: Uncompress JavaFX SDK
          ansible.builtin.unarchive:
            src: "/home/{{ ansible_user }}/g-code-utils/openjfx-{{ openjfx_version }}_linux-{{ openjfx_architecture }}_bin-sdk.zip"
            dest: "/home/{{ ansible_user }}/g-code-utils/openjfx-{{ openjfx_version }}"

        - name: Get release java file
          ansible.builtin.get_url:
            url: "https://github.com/alvarogimenez/g-code-utils/releases/download/v{{ gcode_utils_version}}/g-code-utils-assembly-{{ gcode_utils_version }}.jar"
            dest: "/home/{{ ansible_user }}/g-code-utils/"

        - name: Add alias for Gcode utils tool
          ansible.builtin.lineinfile:
            path: "/home/{{ ansible_user }}/.bashrc"
            line: "alias gcode-utils='java --module-path /home/{{ ansible_user }}/g-code-utils/openjfx-{{ openjfx_version }}/javafx-sdk-{{ openjfx_version }}/lib --add-modules javafx.controls,javafx.fxml,javafx.graphics -jar /home/{{ ansible_user }}/g-code-utils/g-code-utils-assembly-{{ gcode_utils_version }}.jar'"
            state: present

      when: install_gcode_utils

    - name: Install FlatCAM
      block:
        - name: Clone FlatCAM Evo project.
          ansible.builtin.git:
            repo: https://bitbucket.org/marius_stanciu/flatcam_beta.git
            dest: "/home/{{ ansible_user }}/flatcam"
            version: "{{ flatcam_repo_branch }}"

        - name: Install FlatCAM needed packages
          ansible.builtin.apt:
            name: "{{ flatcam_packages }}"
            state: present
          become: true

        - name: Install FlatCAM Python dependencies.
          ansible.builtin.pip:
            name: "{{ flatcam_pip_packages }}"
            extra_args: --upgrade

        - name: Add alias for FlatCAM
          ansible.builtin.lineinfile:
            path: "/home/{{ ansible_user }}/.bashrc"
            line: "alias flatcam='python3 /home/{{ ansible_user }}/flatcam/FlatCAM.py'"
            state: present

      when: install_flatcam

    - name: Install Universal Gcode Sender
      block:
        - name: Download the UGS Debian package
          ansible.builtin.get_url:
            url: "https://github.com/winder/Universal-G-Code-Sender/releases/download/v{{ ugs_version }}/ugs-{{ ugs_version }}-{{ ugs_arch_map[ansible_architecture] }}.deb"
            dest: "/home/{{ ansible_user }}/ugs-{{ ugs_version }}-{{ ugs_arch_map[ansible_architecture] }}.deb"

        - name: Install the UGS Debian package
          ansible.builtin.apt:
            deb: "/home/{{ ansible_user }}/ugs-{{ ugs_version }}-{{ ugs_arch_map[ansible_architecture] }}.deb"
          become: true

      when: install_ugs

    - name: Install F-Engrave
      block:
        - name: Install F-Engrave needed packages
          ansible.builtin.apt:
            name: "{{ fengrave_packages }}"
            state: present
          become: true

        - name: Install F-Engrave Python dependencies
          ansible.builtin.pip:
            name: "{{ fengrave_pip_packages }}"

        - name: Create directory for storing F-Engrave files
          ansible.builtin.file:
            path: "/home/{{ ansible_user }}/fengrave"
            state: directory

        - name: Download F-Engrave source package
          ansible.builtin.get_url:
            url: "https://www.scorchworks.com/Fengrave/F-Engrave-{{ fengrave_version }}_src.zip"
            dest: "/home/{{ ansible_user }}/fengrave/F-Engrave-{{ fengrave_version }}_src.zip"

        - name: Uncompress F-Engrave source package
          ansible.builtin.unarchive:
            src: "/home/{{ ansible_user }}/fengrave/F-Engrave-{{ fengrave_version }}_src.zip"
            dest: "/home/{{ ansible_user }}/fengrave/"

        - name: Build and install ttf2cxf_stream for TTF font support
          ansible.builtin.shell:
            cmd: make install
            chdir: "/home/{{ ansible_user }}/fengrave/F-Engrave-{{ fengrave_version }}_src/TTF2CXF_STREAM"
            creates: /usr/local/bin/ttf2cxf_stream
          become: true

        - name: Add alias for F-Engrave
          ansible.builtin.lineinfile:
            path: "/home/{{ ansible_user }}/.bashrc"
            line: "alias fengrave='python3 /home/{{ ansible_user }}/fengrave/F-Engrave-{{ fengrave_version }}_src/f-engrave.py'"
            state: present

      when: install_fengrave

    - name: Install Kiri:Moto
      block:
        - name: Install Kiri:Moto needed packages
          ansible.builtin.apt:
            name: libfuse2
            state: present
          become: true

        - name: Create directory for storing Kiri:Moto files
          ansible.builtin.file:
            path: "/home/{{ ansible_user }}/kirimoto"
            state: directory

        - name: Download Kiri:Moto AppImage
          ansible.builtin.get_url:
            url: "https://github.com/GridSpace/grid-apps/releases/download/{{ kirimoto_version }}/KiriMoto-linux-x86_64.AppImage"
            dest: "/home/{{ ansible_user }}/kirimoto/KiriMoto-linux-x86_64.AppImage"
            mode: "0755"

        - name: Add alias for Kiri:Moto
          ansible.builtin.lineinfile:
            path: "/home/{{ ansible_user }}/.bashrc"
            line: "alias kirimoto='/home/{{ ansible_user }}/kirimoto/KiriMoto-linux-x86_64.AppImage --no-sandbox'"
            state: present

      when: install_kirimoto

  post_tasks:
    - name: Clean system packages
      apt:
        autoclean: true
        autoremove: true
      become: yes
